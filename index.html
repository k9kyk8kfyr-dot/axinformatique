<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AXinfo"><link rel="manifest" href="manifest.json">
<title>AXinfo Ultimate v17</title>
<style>
:root{--bg:#070b13;--panel:#0f1727;--panel2:#131f33;--line:#263650;--text:#f4f7fb;--muted:#8ea0b8;--blue:#3b82f6;--blue2:#60a5fa;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--cyan:#22d3ee;--shadow:0 20px 55px rgba(0,0,0,.28)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;height:auto;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif;overflow-x:hidden;overflow-y:auto;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;position:relative}body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(4,9,18,.86),rgba(4,9,18,.93));pointer-events:none}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.muted{color:var(--muted)}
/* LOGIN */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;background:linear-gradient(180deg,rgba(4,9,18,.66),rgba(4,9,18,.90));backdrop-filter:blur(1px)}
.login-card{width:min(470px,94vw);padding:34px;background:rgba(9,17,31,.92);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}
.logo-row{display:flex;gap:13px;align-items:center;margin-bottom:24px}.logo{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#60a5fa);font-size:20px;font-weight:900}.brand-title{font-size:28px;font-weight:900}.brand-sub{color:var(--muted);font-size:11px;margin-top:3px}
.field{margin:13px 0}.field label{display:block;color:#cbd5e1;font-size:12px;margin-bottom:7px}.input,.select,.textarea{width:100%;padding:12px 13px;border:1px solid #34455e;border-radius:12px;background:#091321;color:#fff;outline:0}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.btn-primary{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}.btn-secondary{background:#1d2a40;color:#e7effb}.btn-success{background:#12462b;color:#c4f5d4}.btn-warning{background:#4b350b;color:#fde68a}.btn-danger{background:#451e27;color:#fecaca}.btn-small{padding:7px 10px;font-size:11px}
.login-btn{width:100%;margin-top:7px}.login-error{min-height:20px;color:#fca5a5;font-size:12px;margin-top:9px}
/* LAYOUT */
.app{min-height:100vh;height:auto}.sidebar{position:fixed;right:0;top:0;bottom:0;width:255px;padding:16px 13px;background:rgba(8,16,29,.92);border-left:1px solid var(--line);z-index:50;overflow-y:auto;overflow-x:hidden}.main{margin-right:255px;min-height:100vh;height:auto;overflow:visible}.topbar{height:72px;position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(7,11,19,.90);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.top-left{display:flex;align-items:center;gap:10px}.top-title{font-size:18px;font-weight:900}.top-caption{color:var(--muted);font-size:10px;margin-top:3px}.top-actions{display:flex;align-items:center;gap:8px}.top-select{background:#101a2a;color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px}.avatar{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#22c55e);font-weight:900}.menu{display:none;border:1px solid var(--line);background:#18253a;color:#fff;width:40px;height:40px;border-radius:10px}
.side-brand{display:flex;align-items:center;gap:11px;padding:5px 6px 20px;border-bottom:1px solid var(--line);margin-bottom:15px}.side-brand .logo{width:45px;height:45px;border-radius:14px;font-size:17px}.side-brand b{font-size:19px}.side-brand small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.section-label{font-size:10px;color:#73839c;padding:12px 8px 7px}.nav-btn{width:100%;border:1px solid transparent;background:transparent;color:#bdc9da;padding:11px 12px;border-radius:11px;text-align:right;display:flex;align-items:center;gap:10px;margin:2px 0}.nav-btn:hover{background:#132035;color:#fff}.nav-btn.active{background:linear-gradient(90deg,rgba(59,130,246,.20),rgba(59,130,246,.06));border-color:rgba(59,130,246,.28);color:#fff}.nav-icon{width:22px;text-align:center}
.side-bottom{position:sticky;top:calc(100vh - 95px);margin-top:18px;border-top:1px solid var(--line);padding:13px 5px}
.content{padding:25px;max-width:1650px;margin:auto;min-height:calc(100vh - 72px);height:auto;overflow:visible;padding-bottom:70px}
.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px}.welcome h1{margin:0;font-size:28px}.welcome p{margin:6px 0 0;color:var(--muted);font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{background:linear-gradient(180deg,rgba(16,26,44,.92),rgba(13,22,37,.88));border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 10px 30px rgba(0,0,0,.12)}.kpi-top{display:flex;justify-content:space-between;color:#9eacc0;font-size:11px}.kpi-icon{width:34px;height:34px;border-radius:10px;background:#18263b;display:grid;place-items:center}.kpi-value{font-size:25px;font-weight:900;margin-top:12px}.kpi-foot{color:var(--muted);font-size:10px;margin-top:4px}
.layout2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-top:14px}.panel{background:rgba(15,23,39,.86);border:1px solid var(--line);border-radius:17px;box-shadow:0 10px 30px rgba(0,0,0,.12)}.panel-head{padding:16px 17px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-head h3{margin:0;font-size:14px}.panel-body{padding:0 17px 17px}
.chart-wrap{height:255px;padding:6px 2px 8px}.sales-chart{width:100%;height:100%;display:block}.chart-grid{stroke:rgba(142,160,184,.16);stroke-width:1}.chart-axis{fill:#73839c;font-size:10px}.chart-line{fill:none;stroke:#60a5fa;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 4px 9px rgba(37,99,235,.35))}.chart-area{fill:url(#areaGlow);opacity:.30}.chart-dot{fill:#fff;stroke:#60a5fa;stroke-width:3}.chart-bar{fill:rgba(37,99,235,.18)}
.activity{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #1d2a3e}.activity:last-child{border-bottom:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue2);margin-top:5px}.activity b{font-size:11px}.activity p{margin:3px 0 0;color:var(--muted);font-size:10px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick .btn{width:100%}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}.search{flex:1;max-width:430px}.table-wrap{overflow-x:auto;overflow-y:visible}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #213047;padding:12px;text-align:right;white-space:nowrap;font-size:11px}.table th{background:#0d1522;color:#8191aa;position:sticky;top:0}.table tr:hover td{background:rgba(30,41,59,.35)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:800}.green{background:#123824;color:#86efac}.yellow{background:#422f0a;color:#fde68a}.red{background:#421c25;color:#fca5a5}.blue{background:#152f5e;color:#bfdbfe}.empty{text-align:center;padding:32px;color:#70819a}
.stat-list{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{background:#0d1625;border:1px solid var(--line);border-radius:12px;padding:13px}.mini span{display:block;color:var(--muted);font-size:10px}.mini b{display:block;font-size:18px;margin-top:5px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:grid;place-items:center;padding:18px;overflow-y:auto}.modal-card{width:min(740px,100%);max-height:92vh;overflow:auto;background:#101a2b;border:1px solid var(--line);border-radius:21px;padding:21px;box-shadow:var(--shadow)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.modal-head h3{margin:0}.close{border:0;background:#1b283b;color:#fff;width:35px;height:35px;border-radius:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:20px;bottom:20px;z-index:150;background:#152337;border:1px solid var(--line);color:#eef6ff;padding:12px 15px;border-radius:11px;box-shadow:var(--shadow)}
.autocomplete{position:relative}.suggestions{position:absolute;left:0;right:0;top:100%;z-index:300;background:#0b1320;border:1px solid var(--line);border-radius:10px;max-height:190px;overflow:auto;box-shadow:var(--shadow)}.suggestion{padding:10px 12px;border-bottom:1px solid #1d2a3e;cursor:pointer}.suggestion:hover{background:#16243a}.suggestion small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.autocomplete{position:relative}.suggestions{position:absolute;left:0;right:0;top:100%;z-index:140;background:#0d1726;border:1px solid var(--line);border-radius:10px;margin-top:5px;max-height:190px;overflow:auto;box-shadow:var(--shadow)}.suggestion{padding:10px 12px;border-bottom:1px solid #1b2a40;cursor:pointer}.suggestion:hover{background:#15253a}.suggestion small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.invoice-paper{background:#fff;color:#111;padding:28px;border-radius:8px}.invoice-paper table{width:100%;border-collapse:collapse}.invoice-paper th,.invoice-paper td{border:1px solid #ddd;padding:9px;text-align:right}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(2,1fr)}.layout2{grid-template-columns:1fr}}
@media(max-width:820px){.sidebar{transform:translateX(100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-right:0}.menu{display:grid;place-items:center}.topbar{padding:0 14px}.content{padding:17px 14px 80px}}
@media(max-width:600px){.kpis{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.welcome{flex-direction:column;align-items:stretch}.top-actions .avatar{display:none}.top-select{max-width:110px}}
@media(max-width:430px){.kpis{grid-template-columns:1fr}.top-select{display:none}.content{padding-left:10px;padding-right:10px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}.topbar{height:62px}.top-title{font-size:15px}.welcome h1{font-size:23px}.panel-head{align-items:flex-start;flex-direction:column}.search{max-width:none;width:100%}.modal{padding:0;align-items:end}.modal-card{width:100%;max-height:92vh;border-radius:22px 22px 0 0;padding:18px 14px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.modal-actions{position:sticky;bottom:0;background:#101a2b;padding-top:10px}.btn{min-height:44px}.input,.select,.textarea{font-size:16px}.sidebar{width:min(88vw,330px)}.quick{grid-template-columns:1fr 1fr}}
@media(max-width:360px){.quick{grid-template-columns:1fr}.top-actions .btn{padding:8px 10px}}
</style>
</head>
<body>

<div id="loginView" class="login">
  <div class="login-card">
    <div class="logo-row"><div class="logo">AX</div><div><div class="brand-title">AXinfo</div><div class="brand-sub">Ultimate • Professional Shop Manager</div></div></div>
    <div class="field"><label>اسم المستخدم</label><input id="loginUser" class="input" value="admin" autocomplete="username"></div>
    <div class="field"><label>كلمة المرور</label><input id="loginPass" class="input" type="password" value="1234" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn btn-primary login-btn">دخول إلى AXinfo</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="side-brand"><div class="logo">AX</div><div><b>AXinfo</b><small>Ultimate Pro</small></div></div>
    <div class="section-label">WORKSPACE</div>
    <button class="nav-btn active" data-page="dashboard"><span class="nav-icon">⌂</span><span>لوحة التحكم</span></button>
    <button class="nav-btn" data-page="clients"><span class="nav-icon">◎</span><span>العملاء</span></button>
    <button class="nav-btn" data-page="inventory"><span class="nav-icon">▦</span><span>المخزون</span></button>
    <button class="nav-btn" data-page="sales"><span class="nav-icon">◫</span><span>المبيعات</span></button>
    <button class="nav-btn" data-page="purchases"><span class="nav-icon">◧</span><span>المشتريات</span></button>
    <button class="nav-btn" data-page="repairs"><span class="nav-icon">⌁</span><span>الإصلاحات</span></button>
    <button class="nav-btn" data-page="invoices"><span class="nav-icon">▤</span><span>الفواتير</span></button>
    <div class="section-label">FINANCE</div>
    <button class="nav-btn" data-page="debts"><span class="nav-icon">◍</span><span>الديون والدفعات</span></button>
    <button class="nav-btn" data-page="expenses"><span class="nav-icon">◈</span><span>المصاريف</span></button>
    <button class="nav-btn" data-page="reports"><span class="nav-icon">◒</span><span>التقارير</span></button>
    <div class="section-label">SYSTEM</div>
    <button class="nav-btn" data-page="users"><span class="nav-icon">♙</span><span>المستخدمون</span></button>
    <button class="nav-btn" data-page="settings"><span class="nav-icon">⚙</span><span>الإعدادات</span></button>
    <div class="side-bottom"><div class="muted" style="font-size:10px">AXinfo Ultimate v17</div><div class="muted" style="font-size:9px;margin-top:3px">All-in-one local edition</div></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="top-left"><button id="menuBtn" class="menu">☰</button><div><div id="pageTitle" class="top-title">لوحة التحكم</div><div class="top-caption">نظرة عامة على نشاط المتجر</div></div></div>
      <div class="top-actions"><select id="lang" class="top-select"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><div class="avatar">A</div><button id="logoutBtn" class="btn btn-secondary">خروج</button></div>
    </header>
    <main id="content" class="content"></main>
  </div>
</div>

<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
(function(){
var DBKEY="axinfo_v9_db", CREDKEY="axinfo_v9_cred", LANGKEY="axinfo_v9_lang", LOGINKEY="axinfo_v9_login";
var db,cred,lang,current="dashboard";

function defaults(){return{clients:[],suppliers:[],products:[],sales:[],purchases:[],repairs:[],expenses:[],payments:[],debtsLedger:[],invoices:[],users:[],currency:"DZD",settings:{storeName:"AXinfo"}}}
function safeGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}
function init(){
 var raw=safeGet(DBKEY);
 try{db=raw?JSON.parse(raw):defaults()}catch(e){db=defaults()}
 if(!db.clients)db.clients=[];if(!db.suppliers)db.suppliers=[];if(!db.products)db.products=[];if(!db.sales)db.sales=[];if(!db.purchases)db.purchases=[];if(!db.repairs)db.repairs=[];if(!db.expenses)db.expenses=[];if(!db.payments)db.payments=[];if(!db.debtsLedger)db.debtsLedger=[];if(!db.invoices)db.invoices=[];if(!db.users)db.users=[];if(!db.repairParts)db.repairParts=[];if(!db.settings)db.settings={storeName:"AXinfo"};if(!db.suppliers)db.suppliers=[];
 var c=safeGet(CREDKEY);
 try{cred=c?JSON.parse(c):{u:"admin",p:"1234"}}catch(e){cred={u:"admin",p:"1234"}}
 if(!cred||typeof cred.u!=="string"||typeof cred.p!=="string"||cred.u===""){cred={u:"admin",p:"1234"}}
 safeSet(CREDKEY,JSON.stringify(cred));
 lang=safeGet(LANGKEY)||"ar";
}
function save(){safeSet(DBKEY,JSON.stringify(db))}
function trLoginError(){return lang==="fr"?"Nom d'utilisateur ou mot de passe incorrect":lang==="en"?"Incorrect username or password":"اسم المستخدم أو كلمة المرور غير صحيحة"}
function money(n){return Number(n||0).toLocaleString()+" "+(db.currency||"DZD")}
function esc(s){s=String(s==null?"":s);return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function toast(s){var t=document.getElementById("toast");t.innerHTML=s;t.className="toast";window.setTimeout(function(){t.className="toast hidden"},2200)}
function login(){
 var ue=document.getElementById("loginUser"),pe=document.getElementById("loginPass"),ee=document.getElementById("loginError");
 if(!ue||!pe||!ee)return;
 var u=String(ue.value||"").replace(/^\s+|\s+$/g,""),p=String(pe.value||"");
 var eu=(cred&&cred.u)?String(cred.u):"admin",ep=(cred&&cred.p)?String(cred.p):"1234";
 if(u===eu&&p===ep){
  safeSet(LOGINKEY,"1");ee.innerHTML="";
  document.getElementById("loginView").className="login hidden";
  document.getElementById("appView").className="app";
  current="dashboard";render();
 }else{ee.innerHTML=trLoginError();}
}
function logout(){safeSet(LOGINKEY,"");window.location.reload()}
function setLang(v){lang=v;safeSet(LANGKEY,v);document.documentElement.lang=v;document.documentElement.dir=v==="ar"?"rtl":"ltr";render()}
function setCurrent(p){
 current=p;var b=document.querySelectorAll(".nav-btn"),i;
 for(i=0;i<b.length;i++)b[i].className=b[i].getAttribute("data-page")===p?"nav-btn active":"nav-btn";
 document.getElementById("sidebar").className="sidebar";window.scrollTo(0,0);render()
}
function pageTitle(){
 var b=document.querySelector(".nav-btn.active span:nth-child(2)");document.getElementById("pageTitle").innerHTML=b?b.innerHTML:"AXinfo"
}
function header(title,cap,action,id){return'<div class="welcome"><div><h1>'+title+'</h1><p>'+cap+'</p></div><div class="actions">'+(action?'<button class="btn btn-primary" id="'+id+'">'+action+'</button>':'')+'</div></div>'}
function render(){
 pageTitle();document.getElementById("lang").value=lang;
 var c=document.getElementById("content");
 if(current==="dashboard")dashboard(c);else if(current==="clients")clients(c);else if(current==="inventory")inventory(c);else if(current==="sales")sales(c);else if(current==="purchases")purchases(c);else if(current==="repairs")repairs(c);else if(current==="invoices")invoices(c);else if(current==="debts")debts(c);else if(current==="expenses")expenses(c);else if(current==="reports")reports(c);else if(current==="users")users(c);else settings(c)
}
function sum(arr,k){var n=0,i;for(i=0;i<arr.length;i++)n+=Number(arr[i][k]||0);return n}

function smartDemo(){
 if(db.clients.length||db.products.length||db.sales.length){toast("لديك بيانات بالفعل");return}
 db.clients.push({name:"زبون تجريبي",phone:"0550000000",notes:"بيانات تجريبية"});
 db.products.push({name:"Laptop Demo",sku:"AX-1001",qty:8,min:2,buy:65000,sell:82000});
 db.products.push({name:"SSD 512GB",sku:"AX-1002",qty:3,min:2,buy:9000,sell:12500});
 db.sales.push({customer:"زبون تجريبي",product:"Laptop Demo",qty:1,total:82000,paid:82000,cost:65000,profit:17000,date:new Date().toLocaleDateString()});
 db.invoices.push({sale:db.sales.length-1,date:new Date().toLocaleDateString()});
 save();render();toast("تمت إضافة بيانات تجريبية ✓")
}
function smartScanStock(){go("inventory")}
function smartScanDebt(){go("debts")}

function dashboard(c){
 var rev=sum(db.sales,"total"),paid=sum(db.sales,"paid"),buy=sum(db.purchases,"total"),exp=sum(db.expenses,"amount"),debt=rev-paid,profit=rev-buy-exp,low=0,i;
 for(i=0;i<db.products.length;i++)if(Number(db.products[i].qty||0)<=Number(db.products[i].min||0))low++;
 var graph=salesGraph();
 c.innerHTML=header("لوحة التحكم","نظرة شاملة على المبيعات والمخزون والأرباح","بيع سريع","quickSale");

function repairFinance(){
 var revenue=0,buyCost=0,paid=0,i,j,x,parts,p,bc;
 for(i=0;i<db.repairs.length;i++){
  x=db.repairs[i];
  revenue+=Number(x.total!=null?x.total:0);
  paid+=Number(x.paid||0);
  parts=x.parts||[];
  for(j=0;j<parts.length;j++){
   p=parts[j];bc=Number(parts[j].buyCost||0);
   if(!bc && p && p.productId!=null && db.products[p.productId])bc=Number(db.products[p.productId].buy||0);
   buyCost+=bc*Number(parts[j].qty||0);
  }
 }
 return {revenue:revenue,buyCost:buyCost,profit:revenue-buyCost,paid:paid,remaining:Math.max(0,revenue-paid)};
}

 var collected=sf.paid+rf.paid;
 return {salesProfit:sf.profit,repairProfit:rf.profit,expenses:exp,gross:gross,net:net,collected:collected};
}
function profitStockPlan(){
 var f=totalProfitFinance(),profit=Math.max(0,f.net),reinvest=profit*0.70,reserve=profit*0.30,arr=[],i,j,k,p,demand,score,cost,qty,wanted,line;
 for(i=0;i<db.products.length;i++){
  p=db.products[i]; demand=0;
  for(j=0;j<db.sales.length;j++)if(db.sales[j].product===p.name)demand+=Number(db.sales[j].qty||0);
  for(j=0;j<db.repairs.length;j++){
   var ps=db.repairs[j].parts||[];
   for(k=0;k<ps.length;k++)if(ps[k].productId===i||ps[k].name===p.name)demand+=Number(ps[k].qty||0);
  }
  score=(Number(p.qty||0)<=Number(p.min||0)?1000:0)+demand*10+Math.max(0,Number(p.min||0)-Number(p.qty||0));
  if(Number(p.buy||0)>0 && score>0)arr.push({p:p,score:score,demand:demand});
 }
 arr.sort(function(a,b){return b.score-a.score});
 var rows='',budget=reinvest,shown=0;
 for(i=0;i<arr.length && shown<6;i++){
  p=arr[i].p;cost=Number(p.buy||0);if(cost<=0)continue;
  qty=Math.floor(budget/cost);if(qty<=0)continue;
  wanted=Math.max(1,Number(p.min||1)-Number(p.qty||0));
  qty=Math.min(qty,Math.max(1,wanted*2));line=qty*cost;
  if(line<=0||line>budget)continue;
  budget-=line;shown++;
  rows+='<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.sku||'')+'</td><td>'+p.qty+'</td><td>'+qty+'</td><td>'+money(cost)+'</td><td>'+money(line)+'</td><td>'+arr[i].demand+'</td></tr>';
 }
 if(!rows)rows='<tr><td colspan="7" class="empty">لا توجد توصية حالياً. أضف منتجات وأسعار شراء ومخزوناً وحداً أدنى للحصول على اقتراحات.</td></tr>';
 return {finance:f,reinvest:reinvest,reserve:reserve,unspent:budget,rows:rows};
}

function bindDeleteButtons(){var a=document.querySelectorAll("[data-type]"),i;for(i=0;i<a.length;i++)(function(el){el.onclick=function(){var t=el.getAttribute("data-type"),idx=parseInt(el.getAttribute("data-index"),10);if(isNaN(idx))return;if(!confirm("هل تريد حذف هذا السجل؟"))return;if(t==="client")db.clients.splice(idx,1);else if(t==="product")db.products.splice(idx,1);else if(t==="user"&&db.users.length)db.users.splice(idx,1);save();render();toast("تم الحذف ✓")}})(a[i])}
function bindEditButtons(){var a=document.querySelectorAll("[data-edit-product]"),i;for(i=0;i<a.length;i++)(function(el){el.onclick=function(){editProduct(parseInt(el.getAttribute("data-edit-product"),10))}})(a[i])}
function bindInvoiceButtons(){var a=document.querySelectorAll("[data-invoice]"),i;for(i=0;i<a.length;i++)(function(el){el.onclick=function(){printSaleInvoice(parseInt(el.getAttribute("data-invoice"),10))}})(a[i])}
function addExpense(){modal("إضافة مصروف",'<div class="form-grid"><div class="field"><label>البند</label><input id="f1" class="input"></div><div class="field"><label>الفئة</label><input id="f2" class="input"></div><div class="field"><label>المبلغ</label><input id="f3" class="input" type="number" value="0"></div></div>',function(){var t=document.getElementById("f1").value,c=document.getElementById("f2").value,a=Number(document.getElementById("f3").value)||0;if(!t||a<=0){toast("أدخل البند والمبلغ");return}db.expenses.push({title:t,category:c,amount:a,date:new Date().toLocaleDateString()});save();closeModal();render();toast("تم تسجيل المصروف ✓")})}
function addPayment(){var o='<option value="">-- اختر عملية --</option>',i,x,d;for(i=0;i<db.sales.length;i++){x=db.sales[i];d=Number(x.total||0)-Number(x.paid||0);if(d>0)o+='<option value="'+i+'">'+esc(x.customer)+' | '+esc(x.product)+' | '+money(d)+'</option>'}modal("تسجيل دفعة",'<div class="field"><label>العملية</label><select id="f1" class="select">'+o+'</select></div><div class="field"><label>المبلغ</label><input id="f2" class="input" type="number" value="0"></div>',function(){var i=parseInt(document.getElementById("f1").value,10),a=Number(document.getElementById("f2").value)||0;if(isNaN(i)||!db.sales[i]||a<=0){toast("اختر العملية وأدخل المبلغ");return}var x=db.sales[i],r=Number(x.total||0)-Number(x.paid||0);if(a>r){toast("المبلغ أكبر من المتبقي");return}x.paid=Number(x.paid||0)+a;db.payments.push({saleIndex:i,customer:x.customer,amount:a,date:new Date().toLocaleDateString()});save();closeModal();render();toast("تم تسجيل الدفعة ✓")})}
function addUser(){modal("إضافة مستخدم",'<div class="field"><label>اسم المستخدم</label><input id="f1" class="input"></div><div class="field"><label>الدور</label><select id="f2" class="select"><option>staff</option><option>manager</option></select></div>',function(){var u=document.getElementById("f1").value,r=document.getElementById("f2").value,i;if(!u){toast("أدخل اسم المستخدم");return}for(i=0;i<db.users.length;i++)if(db.users[i].username===u){toast("اسم المستخدم موجود");return}db.users.push({username:u,role:r});save();closeModal();render();toast("تمت إضافة المستخدم ✓")})}
function backup(){var blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="AXinfo_backup.json";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},1000);toast("تم إنشاء النسخة الاحتياطية ✓")}
function restore(){var f=document.getElementById("restoreFile").files[0];if(!f){toast("اختر ملف النسخة الاحتياطية");return}var r=new FileReader();r.onload=function(){try{db=JSON.parse(r.result);normalizeDB();save();render();toast("تم الاسترجاع ✓")}catch(e){toast("ملف النسخة الاحتياطية غير صالح")}};r.readAsText(f)}
function normalizeDB(){if(!db.clients)db.clients=[];if(!db.suppliers)db.suppliers=[];if(!db.products)db.products=[];if(!db.sales)db.sales=[];if(!db.purchases)db.purchases=[];if(!db.repairs)db.repairs=[];if(!db.expenses)db.expenses=[];if(!db.payments)db.payments=[];if(!db.debtsLedger)db.debtsLedger=[];if(!db.invoices)db.invoices=[];if(!db.users)db.users=[];if(!db.settings)db.settings={storeName:"AXinfo"};if(!db.currency)db.currency="DZD"}
function printSaleInvoice(i){var x=db.sales[i];if(!x){toast("الفاتورة غير موجودة");return}var w=window.open("","AXinfoInvoice","width=800,height=700");if(!w){toast("اسمح بالنوافذ المنبثقة للطباعة");return}w.document.write('<html dir="rtl"><head><meta charset="utf-8"><title>AXinfo Invoice</title><style>body{font-family:Arial;padding:30px}.total{font-size:20px;font-weight:bold}</style></head><body><h1>'+esc((db.settings&&db.settings.storeName)||"AXinfo")+'</h1><h2>فاتورة بيع</h2><p>العميل: '+esc(x.customer)+'</p><p>المنتج: '+esc(x.product)+'</p><p>الكمية: '+x.qty+'</p><p>الإجمالي: '+money(x.total)+'</p><p>المدفوع: '+money(x.paid||0)+'</p><p class="total">المتبقي: '+money(Number(x.total||0)-Number(x.paid||0))+'</p><script>window.onload=function(){window.print()}<\/script></body></html>');w.document.close()}
function start(){
 init();normalizeDB();save();
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 var lb=document.getElementById("loginBtn");if(lb)lb.onclick=function(){login()};
 var lu=document.getElementById("loginUser"),lp=document.getElementById("loginPass");if(lu)lu.onkeypress=function(e){e=e||window.event;if(e.keyCode===13)login()};if(lp)lp.onkeypress=function(e){e=e||window.event;if(e.keyCode===13)login()};
 var lo=document.getElementById("logoutBtn");if(lo)lo.onclick=function(){logout()};
 var ml=document.getElementById("menuBtn");if(ml)ml.onclick=function(){var s=document.getElementById("sidebar");s.className=s.className.indexOf("open")>=0?"sidebar":"sidebar open"};
 var ls=document.getElementById("lang");if(ls){ls.value=lang;ls.onchange=function(){setLang(this.value)}}
 nav();
 if(safeGet(LOGINKEY)==="1"){document.getElementById("loginView").className="login hidden";document.getElementById("appView").className="app";render();}
}

function bindRepairActions(){
 var b=document.querySelectorAll("[data-repair-view]"),i,q=document.querySelectorAll("[data-repair-invoice]"),j;
 for(i=0;i<b.length;i++)(function(x){x.onclick=function(){viewRepair(Number(x.getAttribute("data-repair-view")))}})(b[i]);
 for(j=0;j<q.length;j++)(function(x){x.onclick=function(){printRepairInvoice(Number(x.getAttribute("data-repair-invoice")))}})(q[j]);
}
function addRepair(){
 var options='<option value="">-- اختر المنتج من المخزون --</option>',i,p;
 for(i=0;i<db.products.length;i++){p=db.products[i];options+='<option value="'+i+'">'+esc(p.name)+' | '+esc(p.sku)+' | مخزون: '+p.qty+' | '+money(p.sell)+'</option>'}
 var fields='<div class="form-grid"><div class="field autocomplete"><label>العميل — ابحث بالاسم أو الهاتف</label><input id="f1" class="input" autocomplete="off" placeholder="اكتب اسم العميل"><div id="repairSug" class="suggestions hidden"></div></div><div class="field"><label>الجهاز / الموديل</label><input id="f2" class="input"></div><div class="field"><label>المشكل</label><input id="f3" class="input"></div><div class="field"><label>أجرة الإصلاح</label><input id="f4" class="input" type="number" value="0"></div><div class="field"><label>الحالة</label><select id="f5" class="select"><option>قيد الإصلاح</option><option>جاهز</option><option>مكتمل</option></select></div></div>';
 fields+='<div class="panel" style="margin-top:12px"><div class="panel-head"><h3>المنتجات / قطع الغيار</h3><button type="button" class="btn btn-small btn-secondary" id="addRepairPart">+ إضافة منتج</button></div><div class="panel-body"><div id="repairPartRows"></div><p><b>إجمالي القطع: <span id="repairPartsTotal">0 '+esc(db.currency)+'</span></b></p></div></div>';
 modal("تسجيل إصلاح",fields,function(){saveRepair()});
 document.getElementById("addRepairPart").onclick=function(){addRepairPartRow(options)};
 addRepairPartRow(options);bindCustomerAutocomplete("f1","repairSug");
}
function addRepairPartRow(options){
 var wrap=document.getElementById("repairPartRows"),d=document.createElement("div");d.style.marginBottom="12px";
 d.innerHTML='<div class="form-grid"><div class="field"><label>المنتج</label><select class="select rpProduct">'+options+'</select></div><div class="field"><label>الكمية</label><input class="input rpQty" type="number" value="1" min="1"></div><div class="field"><label>سعر الوحدة</label><input class="input rpPrice" type="number" value="0"></div><div class="field"><label>الإجمالي</label><input class="input rpTotal" type="number" value="0" readonly></div></div><button type="button" class="btn small danger rpRemove">حذف المنتج</button>';
 wrap.appendChild(d);
 var sel=d.querySelector(".rpProduct"),qty=d.querySelector(".rpQty"),price=d.querySelector(".rpPrice"),total=d.querySelector(".rpTotal");
 function calc(){total.value=(Number(qty.value)||0)*(Number(price.value)||0);updateRepairPartsTotal()}
 sel.onchange=function(){var idx=parseInt(sel.value,10);if(!isNaN(idx)&&db.products[idx])price.value=Number(db.products[idx].sell||0);calc()};
 qty.onkeyup=calc;qty.onchange=calc;price.onkeyup=calc;price.onchange=calc;
 d.querySelector(".rpRemove").onclick=function(){wrap.removeChild(d);updateRepairPartsTotal()};
 calc();
}
function updateRepairPartsTotal(){
 var a=document.querySelectorAll(".rpTotal"),n=0,i;for(i=0;i<a.length;i++)n+=Number(a[i].value)||0;
 var x=document.getElementById("repairPartsTotal");if(x)x.innerHTML=money(n);
}
function saveRepair(){
 var customer=document.getElementById("f1").value,device=document.getElementById("f2").value,problem=document.getElementById("f3").value,cost=Number(document.getElementById("f4").value)||0,status=document.getElementById("f5").value;
 if(!customer||!device){toast("أدخل اسم العميل والجهاز");return}
 var rows=document.querySelectorAll("#repairPartRows > div"),parts=[],i,p,idx,q,price,total;
 for(i=0;i<rows.length;i++){
  idx=parseInt(rows[i].querySelector(".rpProduct").value,10);q=Number(rows[i].querySelector(".rpQty").value)||0;price=Number(rows[i].querySelector(".rpPrice").value)||0;
  if(isNaN(idx)||!db.products[idx]||q<=0)continue;
  p=db.products[idx];
  if(Number(p.qty||0)<q){toast("المخزون غير كافٍ: "+p.name);return}
  total=q*price;parts.push({productId:idx,name:p.name,sku:p.sku,qty:q,price:price,buyCost:Number(p.buy||0),total:total});
 }
 if(!parts.length && cost<=0){toast("أضف منتجًا من المخزون أو أدخل أجرة الإصلاح");return}
 for(i=0;i<parts.length;i++){p=db.products[parts[i].productId];p.qty=Number(p.qty||0)-parts[i].qty}
 var partsTotal=0;for(i=0;i<parts.length;i++)partsTotal+=parts[i].total;
 db.repairs.push({customer:customer,device:device,problem:problem,status:status,cost:cost,paid:0,parts:parts,partsTotal:partsTotal,total:partsTotal+cost,date:new Date().toLocaleDateString()});
 save();closeModal();render();toast("تم حفظ الإصلاح وخصم القطع من المخزون ✓");
}
function viewRepair(i){
 var x=db.repairs[i],parts=x.parts||[],rows="",total=0,j;
 for(j=0;j<parts.length;j++){total+=Number(parts[j].total||0);rows+='<tr><td>'+esc(parts[j].name)+'</td><td>'+parts[j].qty+'</td><td>'+money(parts[j].price)+'</td><td>'+money(parts[j].total)+'</td></tr>'}
 modal("تفاصيل الإصلاح",'<p><b>العميل:</b> '+esc(x.customer)+'</p><p><b>الجهاز:</b> '+esc(x.device)+'</p><p><b>المشكل:</b> '+esc(x.problem)+'</p><p><b>الحالة:</b> '+esc(x.status)+'</p><div class="table-wrap"><table class="table"><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>'+(rows||'<tr><td colspan="4" class="empty">لا توجد منتجات</td></tr>')+'</table></div><p><b>إجمالي المنتجات:</b> '+money(total)+'</p><p><b>أجرة الإصلاح:</b> '+money(x.cost)+'</p><p><b>الإجمالي:</b> '+money(total+Number(x.cost||0))+'</p>',function(){closeModal()});
 document.getElementById("saveM").innerHTML="إغلاق";
}
function printRepairInvoice(i){
 var x=db.repairs[i],parts=x.parts||[],rows="",total=0,j;
 for(j=0;j<parts.length;j++){total+=Number(parts[j].total||0);rows+='<tr><td>'+esc(parts[j].name)+'</td><td>'+parts[j].qty+'</td><td>'+money(parts[j].price)+'</td><td>'+money(parts[j].total)+'</td></tr>'}
 var grand=total+Number(x.cost||0),w=window.open("","AXinfoRepairInvoice","width=850,height=750");
 if(!w){toast("اسمح بالنوافذ المنبثقة للطباعة");return}
 w.document.write('<html dir="rtl"><head><meta charset="utf-8"><title>AXinfo Repair Invoice</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ccc;padding:9px;text-align:right}.total{font-size:20px;font-weight:bold}</style></head><body><h1>'+esc(db.settings&&db.settings.storeName?db.settings.storeName:"AXinfo")+'</h1><h2>فاتورة إصلاح</h2><p>العميل: '+esc(x.customer)+'</p><p>الجهاز: '+esc(x.device)+'</p><p>المشكل: '+esc(x.problem)+'</p><table><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>'+rows+'</table><p>قيمة المنتجات: '+money(total)+'</p><p>أجرة الإصلاح: '+money(x.cost)+'</p><p class="total">الإجمالي: '+money(grand)+'</p><p>المدفوع: '+money(x.paid||0)+'</p><p class="total">المتبقي: '+money(grand-Number(x.paid||0))+'</p><script>window.onload=function(){window.print()}<\/script></body></html>');
 w.document.close();
}

function nav(){var b=document.querySelectorAll(".nav-btn"),i;for(i=0;i<b.length;i++)(function(x){x.onclick=function(){setCurrent(x.getAttribute("data-page"))}})(b[i])}
start();
})();
if("serviceWorker" in navigator){window.setTimeout(function(){try{navigator.serviceWorker.register("./sw.js");}catch(e){}},500);}
