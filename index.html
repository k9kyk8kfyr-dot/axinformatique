(function(){
var DBKEY="axinfo_v9_db", CREDKEY="axinfo_v9_cred", LANGKEY="axinfo_v9_lang", LOGINKEY="axinfo_v9_login";
var db,cred,lang,current="dashboard",bridgeMonitorTimer=null,bridgeAutoSyncTimer=null,bridgeOnline=false,bridgeLastOnline=false,bridgeSyncing=false,bridgeDirty=false,bridgeSuppressAuto=false,bridgeLastRevision=0,bridgeLastSavedSerialized="";

function init(){
 var raw=safeGet(DBKEY);
 try{db=raw?JSON.parse(raw):defaults()}catch(e){db=defaults()}

function translateVisibleUI(){
 var pack=Object.assign({},UI_LANG[lang]||UI_LANG.ar,BRIDGE_I18N[lang]||{},V24_I18N[lang]||{});
 var root=document.body, walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), n;
 while(n=walker.nextNode()){
   if(!n.nodeValue||!n.nodeValue.trim())continue;
   var raw=n.nodeValue.trim();
   if(!n._axOrig)n._axOrig=raw;
   var base=n._axOrig;
   if(pack[base])n.nodeValue=n.nodeValue.replace(raw,pack[base]);
 }
 var fields=root.querySelectorAll('input[placeholder],textarea[placeholder]');
 for(var i=0;i<fields.length;i++){
   var el=fields[i],ph=el.getAttribute('placeholder');
   if(!el._axOrigPlaceholder)el._axOrigPlaceholder=ph||'';
   var basePh=el._axOrigPlaceholder;
   if(pack[basePh])el.setAttribute('placeholder',pack[basePh]);
 }
}

function salesFinance(){

  x=db.sales[i];
  revenue+=Number(x.total||0);
  cost+=Number(x.cost||0);
  paid+=Number(x.paid||0);
 }
 return {revenue:revenue,cost:cost,profit:revenue-cost,paid:paid,remaining:Math.max(0,revenue-paid)};
}
function repairFinance(){
 var revenue=0,buyCost=0,paid=0,i,j,x,parts,p,bc;
 for(i=0;i<db.repairs.length;i++){
  x=db.repairs[i];
  revenue+=Number(x.total!=null?x.total:0);
  paid+=Number(x.paid||0);
  parts=x.parts||[];
  for(j=0;j<parts.length;j++){
   p=parts[j];bc=Number(parts[j].buyCost||0);
   if(!bc && p && p.productId!=null && db.products[p.productId])bc=Number(db.products[p.productId].buy||0);
   buyCost+=bc*Number(parts[j].qty||0);
  }
 }
 return {revenue:revenue,buyCost:buyCost,profit:revenue-buyCost,paid:paid,remaining:Math.max(0,revenue-paid)};
}
function totalProfitFinance(){
 var sf=salesFinance(),rf=repairFinance(),exp=sum(db.expenses,"amount");
 var gross=sf.profit+rf.profit;
 var net=gross-exp;
 var collected=sf.paid+rf.paid;
 return {salesProfit:sf.profit,repairProfit:rf.profit,expenses:exp,gross:gross,net:net,collected:collected};
}
function profitStockPlan(){
 var f=totalProfitFinance(),profit=Math.max(0,f.net),reinvest=profit*0.70,reserve=profit*0.30,arr=[],i,j,k,p,demand,score,cost,qty,wanted,line;
 for(i=0;i<db.products.length;i++){
  p=db.products[i]; demand=0;
  for(j=0;j<db.sales.length;j++)if(db.sales[j].product===p.name)demand+=Number(db.sales[j].qty||0);
  for(j=0;j<db.repairs.length;j++){
   var ps=db.repairs[j].parts||[];
   for(k=0;k<ps.length;k++)if(ps[k].productId===i||ps[k].name===p.name)demand+=Number(ps[k].qty||0);
  }
  score=(Number(p.qty||0)<=Number(p.min||0)?1000:0)+demand*10+Math.max(0,Number(p.min||0)-Number(p.qty||0));
  if(Number(p.buy||0)>0 && score>0)arr.push({p:p,score:score,demand:demand});
 }
 arr.sort(function(a,b){return b.score-a.score});
 var rows='',budget=reinvest,shown=0;
 for(i=0;i<arr.length && shown<6;i++){
  p=arr[i].p;cost=Number(p.buy||0);if(cost<=0)continue;
  qty=Math.floor(budget/cost);if(qty<=0)continue;
  wanted=Math.max(1,Number(p.min||1)-Number(p.qty||0));
  qty=Math.min(qty,Math.max(1,wanted*2));line=qty*cost;
  if(line<=0||line>budget)continue;
  budget-=line;shown++;
  rows+='<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.sku||'')+'</td><td>'+p.qty+'</td><td>'+qty+'</td><td>'+money(cost)+'</td><td>'+money(line)+'</td><td>'+arr[i].demand+'</td></tr>';
 }
 if(!rows)rows='<tr><td colspan="7" class="empty">لا توجد توصية حالياً. أضف منتجات وأسعار شراء ومخزوناً وحداً أدنى للحصول على اقتراحات.</td></tr>';
 return {finance:f,reinvest:reinvest,reserve:reserve,unspent:budget,rows:rows};
}

function normalizeBridgeUrl(url){

 return u;
}

function bridgeFetch(path,options){
 var c=bridgeConfig();
 if(!c.url||!c.token)return Promise.reject(new Error("not configured"));
 var sep=path.indexOf("?")>=0?"&":"?";
 var req=options||{};
 req.headers=req.headers||{};
 req.headers["X-AXinfo-Token"]=c.token;
 return fetch(c.url+path+sep+"token="+encodeURIComponent(c.token),req).then(function(r){
  if(r.status===403)throw new Error("HTTP 403 — رمز الربط غير صحيح");
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
 });
}

function syncPullSilent(remote){
 if(!remote||!remote.data)return Promise.resolve(false);
 bridgeSuppressAuto=true;
 try{db=remote.data;normalizeDB();safeSet(DBKEY,JSON.stringify(db));bridgeLastSavedSerialized=JSON.stringify(db);bridgeDirty=false;bridgeLastRevision=Number(remote.revision||0);}
 finally{bridgeSuppressAuto=false}
 render();
 return Promise.resolve(true);
}
function syncPushSilent(){
 if(bridgeSyncing)return Promise.resolve(false);
 bridgeSyncing=true;
 return bridgeFetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(db)}).then(function(x){
  if(!x.ok)throw new Error(x.error||"save failed");
  bridgeDirty=false; bridgeLastRevision=Number(x.revision||bridgeLastRevision);
  setBridgeStatus(true,"متصل بالكمبيوتر ✓ • مزامنة تلقائية");
  return true;
 }).catch(function(){return false}).then(function(v){bridgeSyncing=false;return v});
}
function autoSyncNow(){
 var c=bridgeConfig();
 if(!c.url||!c.token||bridgeSyncing)return;
 bridgeFetch("/api/load",{cache:"no-store"}).then(function(remote){
   if(!remote||!remote.ok)return;
   var rev=Number(remote.revision||0);
   if(bridgeDirty){
      if(rev>bridgeLastRevision){
         // Both sides changed: keep the local changes and push them as the newest snapshot.
         return syncPushSilent();
      }
      return syncPushSilent();
   }
   if(rev>bridgeLastRevision && remote.data){return syncPullSilent(remote).then(function(){toast("🔄 تمت مزامنة البيانات تلقائيًا ✓")});}
   bridgeLastRevision=Math.max(bridgeLastRevision,rev);
 }).catch(function(){});
}

  idx=parseInt(rows[i].querySelector(".rpProduct").value,10);q=Number(rows[i].querySelector(".rpQty").value)||0;price=Number(rows[i].querySelector(".rpPrice").value)||0;

  if(Number(p.qty||0)<q){toast("المخزون غير كافٍ: "+p.name);return}

 }
